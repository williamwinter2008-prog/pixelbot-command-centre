
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixelBot Command Centre</title>


<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body {

    min-height:100vh;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:white;

    background:

    radial-gradient(
        circle at 50% 20%,
        rgba(37,99,235,0.25),
        transparent 35%
    ),

    radial-gradient(
        circle at 10% 90%,
        rgba(15,60,150,0.25),
        transparent 40%
    ),

    linear-gradient(
        135deg,
        #01030a,
        #020817,
        #04152d
    );

    overflow:hidden;

}


/* stars */

body::before {

    content:"";

    position:fixed;

    inset:0;

    background-image:

    radial-gradient(
        white 1px,
        transparent 1px
    );

    background-size:
    120px 120px;

    opacity:
    0.15;

}



/* NAV */

nav {

    height:80px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:
    0 55px;

    background:
    rgba(0,5,20,0.7);

    border-bottom:
    1px solid
    rgba(80,140,255,0.15);

    backdrop-filter:
    blur(15px);

}



.logo {

    display:flex;

    align-items:center;

    gap:12px;

    font-size:
    22px;

    font-weight:bold;

}



.logo-icon {

    width:42px;

    height:42px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:12px;

    background:

    linear-gradient(
        135deg,
        #2563eb,
        #0b2a66
    );

    box-shadow:

    0 0 25px
    rgba(37,99,235,0.5);

}



/* LOGIN */

.login {

    text-decoration:none;

    color:white;

    padding:
    12px 22px;

    border-radius:10px;

    background:

    rgba(
    88,
    101,
    242,
    0.25
    );

    border:

    1px solid
    rgba(
    88,
    101,
    242,
    0.5
    );

    font-weight:bold;

    transition:.3s;

}



.login:hover {

    transform:
    translateY(-3px);

    box-shadow:

    0 0 30px
    rgba(88,101,242,0.5);

}



/* MAIN */

.container {

    min-height:
    calc(100vh - 80px);

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}



.content {

    max-width:850px;

}



/* STATUS */

.status {

    display:inline-flex;

    align-items:center;

    gap:10px;

    padding:
    8px 18px;

    border-radius:50px;

    background:
    rgba(30,80,160,0.25);

    border:
    1px solid
    rgba(80,140,255,0.3);

    color:#9fc4ff;

    margin-bottom:30px;

}



.dot {

    width:8px;

    height:8px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
    0 0 15px #22c55e;

}



/* TITLE */

h1 {

    font-size:
    clamp(
    55px,
    8vw,
    95px
    );

    letter-spacing:-3px;

    line-height:1;

    margin-bottom:25px;

}



.blue {

    color:#4f8cff;

    text-shadow:

    0 0 40px
    rgba(79,140,255,0.5);

}



/* TEXT */

.description {

    color:#8294b0;

    font-size:18px;

    line-height:1.7;

    max-width:650px;

    margin:
    auto;

    margin-bottom:45px;

}



/* BUTTON */

.launch {

    display:inline-flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:white;

    font-weight:bold;

    padding:
    16px 32px;

    border-radius:12px;


    background:

    linear-gradient(
    135deg,
    #2563eb,
    #123778
    );


    box-shadow:

    0 0 40px
    rgba(37,99,235,0.4);


    transition:.3s;

}



.launch:hover {

    transform:
    translateY(-5px);

    box-shadow:

    0 0 60px
    rgba(37,99,235,0.7);

}



/* FOOTER */

.system {

    margin-top:60px;

    color:#64748b;

    font-size:13px;

    letter-spacing:1px;

}



</style>

</head>


<body>



<nav>


<div class="logo">


<div class="logo-icon">
🌌
</div>


PixelBot


</div>



<a href="/api/discord-login" class="login">

Login with Discord

</a>


</nav>




<div class="container">


<div class="content">



<div class="status">

<span class="dot"></span>

PixelBot Systems Online

</div>



<h1>

Enter the

<span class="blue">
Command Centre
</span>

</h1>




<p class="description">

Manage your Discord servers,
configure PixelBot,
and control your communities
from one futuristic dashboard.

</p>




<a href="/api/discord-login" class="launch">

🚀 Launch PixelBot

</a>




<div class="system">

SECURE CONNECTION • DISCORD AUTH • PIXELBOT V2

</div>



</div>


</div>



</body>

</html>
